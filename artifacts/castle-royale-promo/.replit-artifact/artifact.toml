kind = "video"
previewPath = "/castle-royale-promo/"
title = "Castle Royale Promo"
version = "1.0.0"
id = "artifacts/castle-royale-promo"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/castle-royale-promo/" ]
localPort = 20193

[services.development]
run = "pnpm --filter @workspace/castle-royale-promo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/castle-royale-promo", "run", "build" ]
publicDir = "artifacts/castle-royale-promo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20193"
BASE_PATH = "/castle-royale-promo/"
